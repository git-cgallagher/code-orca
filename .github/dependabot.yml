# Keeps the SHA-pinned actions in .github/workflows current (Dependabot updates the SHA and the version
# comment together) and the package's Python ranges. Exact runtime versions are pinned in the container image.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']
  # The image's FROM lines. Dependabot's docker parser reads literal `FROM image:tag@sha256:...` lines only:
  # `FROM ${BASE_IMAGE}` is invisible to it (checked against dependabot-core's docker/file_parser.rb,
  # 2026-11-03). It bumps the base only while the Dockerfile names it in a literal FROM (a pinned stage the
  # BASE_IMAGE default points at); otherwise the base bump is manual (docs/CONTAINER.md).
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ['*']

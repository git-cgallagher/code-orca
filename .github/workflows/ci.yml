name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false   # the wrapper would swallow plan's -detailed-exitcode 2
      - name: Install
        run: python -m pip install -e '.[dev,ansible]'   # ansible-core: the Ansible tests skip without it
      # An editable install maps the whole source tree, so it cannot notice a subpackage missing from the wheel:
      # build the real wheel and import every subpackage from it in a scratch venv (with its `ansible` extra:
      # the callback plugin imports ansible-core at module level).
      - name: Wheel ships every subpackage
        run: |
          python -m pip wheel . --no-deps -w /tmp/wheel
          python -m venv /tmp/wheel-venv
          whl=$(ls /tmp/wheel/*.whl)
          /tmp/wheel-venv/bin/pip install -q --no-cache-dir "${whl}[ansible]"
          /tmp/wheel-venv/bin/python -c 'import codeorca.adapters.terraform, codeorca.redact, codeorca.specs.terraform_plan, codeorca.steps.terraform, codeorca.cli'
          /tmp/wheel-venv/bin/python -c 'import codeorca.adapters.ansible, codeorca.steps.ansible, codeorca.steps.host_spec, codeorca.specs.ansible_host, codeorca.specs.ansible_vars, codeorca.specs.ansible_files, codeorca.lint, codeorca.ansible_plugins.callback.codeorca_jsonl'
          /tmp/wheel-venv/bin/codeorca --version
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Schemas are current
        run: codeorca schema export schema --check
      - name: Validate the reference workflows
        run: codeorca validate examples/reference/workflows/*.yaml
      - name: Tests
        run: pytest -q
      # The reference project end to end. The redaction key and the stack's sensitive input are PLACEHOLDERS
      # (the value is committed in the workflow file); the assertions below prove they never reach a spec, a log
      # or the run directory.
      - name: Run the plan-only workflow
        env:
          CODEORCA_REDACTION_KEY: example-not-secret-ci-key
        run: codeorca run plan-only -p examples/reference/codeorca.yaml
      - name: "Drift over every stack (exit 2 expected: a fresh local state always has changes)"
        env:
          CODEORCA_REDACTION_KEY: example-not-secret-ci-key
          TF_VAR_app_secret: FIXTURE-SECRET-reference-001   # drift carries no workflow inputs; the sensitive variable comes from the env
        run: |
          set +e
          codeorca drift -p examples/reference/codeorca.yaml
          rc=$?
          set -e
          test "$rc" -eq 2 || { echo "expected drift exit 2, got $rc"; exit 1; }
      # Ansible end to end: the role writes app.conf under /tmp/codeorca-reference (outside the repository), the
      # host spec lands in examples/reference/specs/app/hosts/ (gitignored). The api_token input's default is a
      # PLACEHOLDER committed in the workflow file.
      - name: Run the configure-local workflow
        env:
          CODEORCA_REDACTION_KEY: example-not-secret-ci-key
        run: codeorca run configure-local -p examples/reference/codeorca.yaml
      - name: Lint the reference playbooks
        run: codeorca lint ansible -p examples/reference/codeorca.yaml examples/reference/ansible
      - name: No placeholder secret anywhere in the produced files
        # Each check is its own fatal `if`: under `bash -e` a `! grep` never fails the step (errexit ignores an
        # inverted pipeline, and a multi-line run exits with its LAST command's status). `-a` scans the binary
        # plan file as text too.
        run: |
          ls examples/reference/specs/app/plan.yaml examples/reference/specs/app/plan.meta.yaml
          ls examples/reference/specs/app/hosts/app-host.yaml examples/reference/specs/app/hosts/app-host.meta.yaml
          for pattern in FIXTURE-SECRET FIXTURE-SECRET-reference-token-001 example-not-secret-ci-key; do
            if grep -raq "$pattern" examples/reference/specs examples/reference/.codeorca; then
              echo "placeholder secret leaked into the produced files: $pattern"
              grep -ral "$pattern" examples/reference/specs examples/reference/.codeorca
              exit 1
            fi
          done
      - name: Produced files are not tracked
        run: test -z "$(git status --porcelain examples/reference)"

name: image

# The code-orca-runtime image (container/Dockerfile, target `runtime`), modelled on
# ansible-runtime/.github/workflows/build.yml. See docs/CONTAINER.md.
# PR: build on both architectures, smoke-test, scan. Nothing is pushed.
# main (push, weekly schedule, manual run): the same, then :main; a push also gets :sha-<short>.
# Tag vX.Y.Z (.github/ci/release-check.sh: strict vX.Y.Z, equal to pyproject.toml's version, on
#   main): :X.Y.Z, plus :X.Y and :latest only when it is the highest release of its line / overall
#   (a backport or two racing tags never move them backwards). An existing :X.Y.Z is never
#   re-pointed (.github/ci/refuse-overwrite.sh), except by a re-run with the same digests. The
#   index gets build provenance and an SPDX SBOM attestation.
# Weekly: rebuild :main so Debian security updates land without a code change; a schedule
#   runs on main, so it never produces a release tag.
# A manual run on any other branch builds and tests only (PUBLISH is false there).
on:
  # No `paths:` filter on pull_request: `image (amd64)` and `image (arm64)` are meant to become
  # required checks, and a required check whose workflow a path filter skipped stays "Expected"
  # forever, blocking the PR (ansible-runtime has no filter for the same reason).
  pull_request:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/image.yml'
      - 'examples/reference/**'
    tags: ['v*.*.*']
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/git-cgallagher/code-orca-runtime
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job sets timeout-minutes: GitHub's default is 6 hours, and a stalled apt, pip,
# PowerShell Gallery or image pull would hold the runner that long. Each limit is several
# times the job's expected slowest run (the image job is ansible-runtime's 30 plus the
# Terraform and PowerShell layers).
jobs:
  # One job per architecture, each on a native runner (no QEMU). The job names
  # `image (amd64)` and `image (arm64)` are meant to become required checks on the
  # "main protection" ruleset once they have run once (that ruleset change is a separate,
  # manual step; this workflow never edits rulesets). Do not rename them.
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # push by digest (outside pull_request only)
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # origin/main and every tag, for the release check

      - name: A release tag is strict, equals pyproject.toml's version and is on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref_name }}
        run: .github/ci/release-check.sh "$REF" > /dev/null

      # The OCI version/revision labels. Not pins: a tag run labels X.Y.Z, anything else sha-<short>.
      # The two ARGs sit just before the Dockerfile's LABEL, so a new value rebuilds no layer.
      - name: Image labels
        id: labels
        env:
          REF: ${{ github.ref_name }}
        run: |
          case $GITHUB_REF in
            refs/tags/v*) version=${REF#v} ;;
            *) version=sha-${GITHUB_SHA::7} ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # The only build-args are the two labels: the Dockerfile's ARG defaults (BASE_IMAGE,
      # TF_VERSION, PWSH_VERSION, PSSA_VERSION) are the single source of truth for every pin.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: code-orca-runtime:test
          build-args: |
            IMAGE_VERSION=${{ steps.labels.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}-runtime
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-runtime

      - name: Smoke test
        run: docker run --rm -v "$PWD":/work -w /work code-orca-runtime:test bash container/tests/smoke.sh

      - name: The smoke test left the checkout clean
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "::error::the smoke test changed tracked or unignored files"
            echo "$status"
            exit 1
          fi

      - name: Scan for fixable critical vulnerabilities
        if: matrix.arch == 'amd64'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: code-orca-runtime:test
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the Build step, so it is all cache hits; only the push is new.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_VERSION=${{ steps.labels.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}-runtime
          provenance: false

      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the two per-arch digests into one multi-arch index under the tags, then attests it.
  manifest:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write      # the tags, and the attestations pushed next to the image
      id-token: write      # Sigstore signing of the attestations
      attestations: write  # the repository's attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # origin/main and every tag, for the release check

      # Outputs version, latest (highest vX.Y.Z on main) and minor (highest vX.Y.*).
      - name: A release tag is strict, equals pyproject.toml's version and is on main
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref_name }}
        run: .github/ci/release-check.sh "$REF"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-runtime-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main (push, schedule, dispatch): :main; a push to main also :sha-<short>.
      # A tag: :X.Y.Z; :X.Y and :latest only when release-check says this is the highest of its
      # line / overall (the semver types only ever match a tag ref). No `image-release`
      # concurrency group: GitHub cancels a PENDING run when a third joins the group, which would
      # silently drop a release; the highest-version rule makes the order irrelevant instead.
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}

      # GHCR tags are mutable. A release version must never be re-pointed: consumers pin it
      # (codeorca.yaml's runtime.image), and the weekly rebuild only ever moves :main. Only a
      # registry "not found" counts as absent; any other error fails. A re-run whose digests equal
      # the existing index's (the tags went out, then an attestation failed) may proceed.
      - name: Refuse to overwrite an existing release
        id: guard
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: .github/ci/refuse-overwrite.sh "$IMAGE" "$VERSION" "$RUNNER_TEMP/digests"

      - name: Create the multi-arch manifest
        id: create
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.release.outputs.version }}
          RERUN: ${{ steps.guard.outputs.rerun }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then echo "::error::no tags for $GITHUB_REF"; exit 1; fi
          if [ -n "$VERSION" ] && ! grep -qxF "$IMAGE:$VERSION" <<< "$TAGS"; then
            echo "::error::the tags for $GITHUB_REF do not include $IMAGE:$VERSION"
            exit 1
          fi
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          if [ "${#sources[@]}" -ne 2 ]; then echo "::error::expected 2 digests, got ${#sources[@]}"; exit 1; fi
          if [ "$RERUN" = true ]; then
            # carbon copy of the existing index: its digest (what consumers pin) does not change
            existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
            docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$existing"
          else
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
          fi
          first=$(head -n1 <<< "$TAGS")
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.create.outputs.digest }}
          push-to-registry: true

      # syft resolves the index to the runner's platform, so the SBOM lists the linux/amd64
      # image's contents; the two arches are built from the same pins.
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.create.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.create.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

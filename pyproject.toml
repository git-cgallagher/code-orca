[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "code-orca"
version = "0.0.1"
description = "Terraform + Ansible orchestrator: YAML workflows, redacted resolved-configuration specs, Python/PowerShell helpers, one container"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Gallagher" }]
requires-python = ">=3.13"
# Runtime deps are the ones already pinned in the execution environment (ghcr.io/git-cgallagher/ansible-runtime);
# exact versions are locked in the container image, not here.
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.11",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "moto[s3,ssm,sts]>=5",  # AWS mocked in tests/providers and tests/bootstrap; never real AWS
]
# The ansible step and the host-spec renderer need ansible-core; the tests under tests/ansible skip without it.
ansible = ["ansible-core>=2.21,<2.22"]
# The SSM secrets provider, the SSM-backed redaction key and the S3 backend bootstrap need boto3; without it they
# fail closed with a message naming this extra.
aws = ["boto3>=1.35"]

[project.scripts]
codeorca = "codeorca.cli:main"

[project.urls]
Repository = "https://github.com/git-cgallagher/code-orca"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]  # every subpackage under src/, so a new one cannot be left out of the wheel; CI imports them

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

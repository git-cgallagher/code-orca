[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "code-orca"
version = "0.0.1"
description = "Terraform + Ansible orchestrator: YAML workflows, redacted resolved-configuration specs, Python/PowerShell helpers, one container"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Gallagher" }]
requires-python = ">=3.13"
# Runtime deps are the ones already pinned in the execution environment (ghcr.io/git-cgallagher/ansible-runtime);
# exact versions are locked in the container image, not here.
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.11",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
codeorca = "codeorca.cli:main"

[project.urls]
Repository = "https://github.com/git-cgallagher/code-orca"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["codeorca", "codeorca.steps"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# group_vars for the host spec fixture inventory. Every secret-looking value is a placeholder.
app_name: demo
app_env: dev
app_port: "{{ 8000 + 80 }}"
app_fqdn: "{{ app_name }}-{{ app_env }}.example.com"
app_url: "http://{{ app_fqdn }}:{{ app_port }}"
listen_ip: "{{ ansible_host }}"
app_config_listen: "{{ listen_ip }}:{{ app_port }}"
# key denylist: skipped by name, never templated
db_password: "FIXTURE-SECRET-db-password-{{ app_env }}"
# declared no_log: true in roles/app_config/meta/argument_specs.yml: emitted as <secret: declared>
app_config_api_credential: FIXTURE-SECRET-declared-nolog-001
app_config_extra:
  region: us-east-1
  token: FIXTURE-SECRET-nested-nolog-001
# lookups: env is denylisted (plan), file runs, amazon.aws is denylisted by raw name (collection not installed)
from_env: "{{ lookup('env', 'HOME') }}"
motd: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/../files/motd.txt') | trim }}"
from_ssm: "{{ lookup('amazon.aws.ssm_parameter', '/example/app/param') }}"
# a lookup whose argument is denylist-named
from_query: "{{ query('ansible.builtin.file', inventory_dir ~ '/../files/motd.txt', api_token_file) }}"
api_token_file: unused.txt
# per-key error isolation
broken: "{{ not_defined_anywhere }}"
nested:
  url: "{{ app_url }}/api"
  ports: [80, "{{ app_port }}"]
vaulted_value: !vault |
